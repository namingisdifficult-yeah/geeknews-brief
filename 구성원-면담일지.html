<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구성원 면담일지</title>
<!--
  구성원 면담일지 — 파일럿 (단일 HTML 파일)
  - 외부 의존성/CDN 없음, 오프라인 동작
  - 데이터: localStorage["myeondam_ilji_v1"]
  - 더블클릭으로 브라우저에서 바로 열림
  화면: 대시보드 / 구성원 목록 / 구성원 상세(타임라인) / 면담 작성·상세 / 설정·백업
-->
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5;
    --text:#1f2733; --text-soft:#5b6675; --text-faint:#8b94a3;
    --line:#e3e7ec; --line-strong:#d2d8e0;
    --brand:#3a5a8c; --brand-soft:#e9eff7; --brand-ink:#27406a;
    --pos:#2f8f5b; --pos-soft:#e4f4ea;
    --neu:#7a8493; --neu-soft:#eef0f3;
    --att:#c0492f; --att-soft:#fbe9e4;
    --warn:#b9772a; --warn-soft:#fbf0df;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(31,39,51,.06), 0 2px 8px rgba(31,39,51,.05);
    --maxw:880px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ===== App shell ===== */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow);
  }
  .topbar-inner{
    max-width:var(--maxw); margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:14px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--brand-ink)}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--brand);
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .nav a{
    padding:7px 12px;border-radius:999px;color:var(--text-soft);font-size:14px;font-weight:500;
  }
  .nav a:hover{background:var(--surface-2);color:var(--text)}
  .nav a.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 64px}

  /* ===== Generic UI ===== */
  .page-title{font-size:20px;font-weight:700;margin:2px 0 16px}
  .muted{color:var(--text-faint)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .empty{
    text-align:center;padding:48px 20px;color:var(--text-faint);
    border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);
  }
  .empty .big{font-size:34px;margin-bottom:8px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:8px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
    padding:2px 9px;border-radius:999px;background:var(--neu-soft);color:var(--neu)}
  .badge.pos{background:var(--pos-soft);color:var(--pos)}
  .badge.neu{background:var(--neu-soft);color:var(--neu)}
  .badge.att{background:var(--att-soft);color:var(--att)}

  /* dev/skeleton helper (1단계 임시 표시) */
  .seed-info{margin-top:18px}
  .seed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--brand-ink)}
  .stat .l{font-size:13px;color:var(--text-soft);margin-top:2px}

  /* ===== Toolbar (title + actions) ===== */
  .toolbar{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
  .toolbar .page-title{margin:0}
  .toolbar .spacer{margin-left:auto}

  /* ===== Search & filter row ===== */
  .filterbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;position:relative}
  .search input{
    width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);
  }
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:14px}
  .check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;accent-color:var(--brand)}

  /* ===== Member cards ===== */
  .member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .member-card{
    display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;transition:border-color .12s, transform .04s;
  }
  .member-card:hover{border-color:var(--brand)}
  .member-card:active{transform:translateY(1px)}
  .member-card.inactive{opacity:.62}
  .mc-top{display:flex;align-items:center;gap:11px}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;background:var(--brand-soft);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  }
  .mc-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mc-sub{color:var(--text-soft);font-size:13px;margin-top:1px}
  .mc-meta{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--text-faint);flex-wrap:wrap}
  .mc-meta .sep{color:var(--line-strong)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .tag{font-size:11.5px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:1px 8px;border-radius:999px}
  .pill-off{font-size:11px;font-weight:700;color:var(--text-faint);background:var(--surface-2);
    border:1px solid var(--line);padding:1px 7px;border-radius:999px}

  /* ===== Forms ===== */
  .form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;max-width:640px}
  .field{margin-bottom:15px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px}
  .field .req{color:var(--att)}
  .field .hint{font-weight:400;color:var(--text-faint);font-size:12px}
  .input,.select,.textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);
  }
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .textarea{resize:vertical;min-height:70px;line-height:1.5}
  .field-row{display:flex;gap:12px}
  .field-row>.field{flex:1}
  .form-actions{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .form-actions .spacer{margin-left:auto}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-soft)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.danger{border-color:var(--att);color:var(--att);background:var(--surface)}
  .btn.danger:hover{background:var(--att-soft)}
  .btn.small{padding:5px 10px;font-size:13px}
  .err{color:var(--att);font-size:13px;margin-top:8px;min-height:1px}

  .breadcrumb{font-size:13px;color:var(--text-faint);margin-bottom:10px}
  .breadcrumb a:hover{color:var(--brand);text-decoration:underline}

  /* ===== Member detail: profile header ===== */
  .profile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px}
  .profile-head{display:flex;align-items:flex-start;gap:14px}
  .avatar.lg{width:58px;height:58px;font-size:22px}
  .profile-name{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .profile-sub{color:var(--text-soft);font-size:14px;margin-top:2px}
  .profile-note{margin-top:12px;color:var(--text);font-size:14px;background:var(--surface-2);
    border-radius:var(--radius-sm);padding:10px 12px;white-space:pre-wrap}
  .summary-row{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .summary-item .v{font-size:17px;font-weight:700}
  .summary-item .k{font-size:12px;color:var(--text-faint);margin-top:1px}

  .section{margin-top:22px}
  .section-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .section-head h2{font-size:15px;font-weight:700;margin:0}
  .section-head .count{font-size:12px;color:var(--text-faint);background:var(--surface-2);
    border-radius:999px;padding:1px 8px}
  .section-head .spacer{margin-left:auto}

  /* ===== Open action items (highlight) ===== */
  .open-actions{background:var(--att-soft);border:1px solid #f0cfc4;border-radius:var(--radius);padding:6px 14px}
  .action-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0d6cc}
  .action-row:last-child{border-bottom:none}
  .action-check{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--pos);cursor:pointer}
  .action-body{flex:1;min-width:0}
  .action-content{font-size:14px}
  .action-meta{font-size:12px;color:var(--text-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .due{font-weight:600}
  .due.over{color:var(--att)}
  .due.soon{color:var(--warn)}
  .action-row.done .action-content{text-decoration:line-through;color:var(--text-faint)}

  /* ===== Timeline ===== */
  .timeline{display:flex;flex-direction:column;gap:10px}
  .tl-card{display:block;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:13px 15px;cursor:pointer}
  .tl-card:hover{border-color:var(--brand);border-left-color:var(--brand)}
  .tl-card.pos{border-left-color:var(--pos)} .tl-card.neu{border-left-color:var(--neu)} .tl-card.att{border-left-color:var(--att)}
  .tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-type{font-weight:700;font-size:14px}
  .tl-date{font-size:12.5px;color:var(--text-faint)}
  .tl-format{font-size:11.5px;color:var(--text-soft);background:var(--surface-2);border-radius:999px;padding:1px 8px}
  .tl-summary{font-size:13.5px;color:var(--text-soft);margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tl-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .tl-topics{display:flex;gap:5px;flex-wrap:wrap}

  /* ===== Meeting detail ===== */
  .mtg-block{margin-bottom:16px}
  .mtg-block .k{font-size:12px;font-weight:700;color:var(--text-faint);text-transform:none;margin-bottom:4px;letter-spacing:.02em}
  .mtg-block .v{font-size:14.5px;white-space:pre-wrap;line-height:1.6}
  .private-note{background:#fff8ec;border:1px dashed var(--warn);border-radius:var(--radius-sm);padding:12px 14px}
  .private-note .k{color:var(--warn);display:flex;align-items:center;gap:5px}
  .private-note .v{color:#6b4d18}

  /* ===== Segmented control (mood/format) ===== */
  .segmented{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;flex-wrap:wrap}
  .segmented label{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--text-soft);cursor:pointer;
    border-right:1px solid var(--line);background:var(--surface);user-select:none}
  .segmented label:last-child{border-right:none}
  .segmented input{position:absolute;opacity:0;pointer-events:none}
  .segmented input:checked+span{}
  .segmented label.on{background:var(--brand-soft);color:var(--brand-ink)}
  .segmented label.on.pos{background:var(--pos-soft);color:var(--pos)}
  .segmented label.on.att{background:var(--att-soft);color:var(--att)}
  .segmented label.on.neu{background:var(--neu-soft);color:var(--neu)}

  /* ===== Action item editor (면담 폼 내부) ===== */
  .ai-editor{display:flex;flex-direction:column;gap:8px}
  .ai-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ai-row .input,.ai-row .select{padding:7px 9px}
  .ai-content{flex:2;min-width:150px}
  .ai-assignee{width:120px;flex:none}
  .ai-due{width:150px;flex:none}
  .ai-del{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-faint);
    width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;line-height:1}
  .ai-del:hover{color:var(--att);border-color:var(--att)}
  .ai-add{align-self:flex-start;margin-top:2px}

  /* ===== Meeting detail action list ===== */
  .mtg-actions{margin-top:6px}
  .mtg-actions .action-row{border-color:var(--line)}
  .mtg-actions{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px 14px}
  .mtg-actions .action-row{border-bottom:1px solid var(--line)}

  /* ===== Dashboard ===== */
  .dash-greet{font-size:15px}
  .dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .dash-list{display:flex;flex-direction:column}
  .dash-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .dash-item:last-child{border-bottom:none}
  .dash-item .avatar{width:34px;height:34px;font-size:13px}
  .dash-item .grow{flex:1;min-width:0}
  .dash-item .t1{font-weight:600;font-size:14px}
  .dash-item .t2{font-size:12.5px;color:var(--text-soft);margin-top:1px}
  .dash-item .r{font-size:12.5px;font-weight:600;color:var(--text-faint);white-space:nowrap}
  .dash-item .r.warn{color:var(--att)}
  .mini-empty{color:var(--text-faint);font-size:13.5px;padding:6px 2px}

  /* ===== Settings ===== */
  .set-section{margin-bottom:14px}
  .set-section h2{font-size:14px;font-weight:700;margin:0 0 4px}
  .set-section p.desc{margin:0 0 10px;font-size:12.5px;color:var(--text-faint)}
  .danger-zone{border-color:#f0cfc4}
  .notice{background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;line-height:1.55;margin-bottom:18px}
  .notice b{font-weight:700}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#23303f;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media (max-width:560px){
    .seed-grid{grid-template-columns:1fr 1fr}
    .brand span.full{display:none}
    .member-grid{grid-template-columns:1fr}
    .field-row{flex-direction:column;gap:0}
    .form{padding:16px}
    .summary-row{gap:16px}
    .ai-assignee,.ai-due{width:calc(50% - 4px)}
    .ai-content{flex:1 1 100%}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand"><span class="dot">面</span><span class="full">구성원 면담일지</span></a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="/">대시보드</a>
        <a href="#/members" data-route="/members">구성원</a>
        <a href="#/settings" data-route="/settings">설정</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="app"><!-- 화면이 여기에 렌더링됨 --></main>

<script>
/* =========================================================================
 *  구성원 면담일지 — 1단계: 저장소 유틸 + 라우터 + 샘플 시드
 * ========================================================================= */
(function(){
  "use strict";

  /* ---------- 상수 ---------- */
  var STORAGE_KEY = "myeondam_ilji_v1";

  /* ---------- 작은 헬퍼 ---------- */
  function uuid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    // 폴백 (구형 브라우저)
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
      var r = Math.random()*16|0, v = c==="x"? r : (r&0x3|0x8); return v.toString(16);
    });
  }
  function nowISO(){ return new Date().toISOString(); }
  function daysAgoISO(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
  function ymd(d){ // Date -> YYYY-MM-DD
    var x = (d instanceof Date)? d : new Date(d);
    var m = ("0"+(x.getMonth()+1)).slice(-2), day=("0"+x.getDate()).slice(-2);
    return x.getFullYear()+"-"+m+"-"+day;
  }
  var _toastTimer=null;
  function toast(msg){
    var el = document.getElementById("toast");
    if (!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add("show");
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }
  function esc(s){ // HTML escape
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- 저장소 (localStorage) ---------- */
  var Store = {
    load: function(){
      var raw;
      try { raw = localStorage.getItem(STORAGE_KEY); }
      catch(e){ console.warn("localStorage 읽기 실패", e); return defaultData(); }
      if (!raw){ // 최초 실행 → 샘플 시드
        var seeded = seedData();
        this.save(seeded);
        return seeded;
      }
      try {
        var data = JSON.parse(raw);
        return normalize(data);
      } catch(e){
        console.error("데이터 파싱 실패 — 기본값으로 시작", e);
        return defaultData();
      }
    },
    save: function(data){
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch(e){
        console.error("저장 실패", e);
        alert("저장에 실패했습니다. 브라우저 저장공간이 가득 찼거나 차단되었을 수 있어요.\n(시크릿/사생활보호 모드에서는 저장이 제한될 수 있습니다.)");
        return false;
      }
    }
  };

  function defaultData(){
    return {
      members:[], meetings:[], actionItems:[],
      settings:{
        displayName:"", orgName:"",
        meetingTypes:["정기","성과","고충","경력개발","온보딩","수시"],
        overdueDays:30
      }
    };
  }

  // 외부에서 가져온 데이터 등에 누락 필드가 있어도 안전하게 보정
  function normalize(d){
    var base = defaultData();
    d = d || {};
    return {
      members: Array.isArray(d.members)? d.members : [],
      meetings: Array.isArray(d.meetings)? d.meetings : [],
      actionItems: Array.isArray(d.actionItems)? d.actionItems : [],
      settings: Object.assign({}, base.settings, d.settings||{})
    };
  }

  /* ---------- 샘플 데이터 시드 ---------- */
  function seedData(){
    var d = defaultData();
    d.settings.displayName = "김리더";
    d.settings.orgName = "프로덕트팀";

  /* ---------- 파생값 계산 (저장 안 함, 그릴 때 실시간) ---------- */
  var Compute = {
    meetingsOf: function(d, memberId){
      return d.meetings
        .filter(function(m){ return m.memberId===memberId; })
        .sort(function(a,b){ return new Date(b.date) - new Date(a.date); }); // 최신순
    },
    lastMeeting: function(d, memberId){
      var ms = this.meetingsOf(d, memberId);
      return ms.length ? ms[0] : null;
    },
    meetingCount: function(d, memberId){
      return d.meetings.filter(function(m){ return m.memberId===memberId; }).length;
    },
    latestMood: function(d, memberId){
      var last = this.lastMeeting(d, memberId);
      return last ? last.mood : null;
    },
    openActionsOf: function(d, memberId){
      return d.actionItems.filter(function(a){ return a.memberId===memberId && a.status==="todo"; });
    },
    daysSince: function(iso){
      if (!iso) return null;
      var diff = Date.now() - new Date(iso).getTime();
      return Math.floor(diff / 86400000);
    }
  };

  /* ---------- 표시 헬퍼 ---------- */
  function initials(name){
    name = (name||"").trim();
    return name ? name.slice(0, name.length>2?1:2) : "·"; // 한글 이름은 성 한 글자
  }
  function fmtDate(iso){
    if (!iso) return "";
    var x = new Date(iso);
    return x.getFullYear()+". "+(x.getMonth()+1)+". "+x.getDate()+".";
  }
  function relDays(iso){
    var n = Compute.daysSince(iso);
    if (n==null) return "기록 없음";
    if (n<=0) return "오늘";
    if (n===1) return "어제";
    return n+"일 전";
  }
  function fmtDateTime(iso){
    if (!iso) return "";
    var x = new Date(iso);
    var h = x.getHours(), ap = h<12?"오전":"오후", h12 = h%12; if(h12===0) h12=12;
    var mm = ("0"+x.getMinutes()).slice(-2);
    return fmtDate(iso)+" "+ap+" "+h12+":"+mm;
  }
  // ISO -> datetime-local 입력값 (로컬 기준)
  function toLocalInput(iso){
    var x = iso? new Date(iso) : new Date();
    var p = function(n){return ("0"+n).slice(-2);};
    return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())+"T"+p(x.getHours())+":"+p(x.getMinutes());
  }
  function fromLocalInput(val){
    if (!val) return nowISO();
    var d = new Date(val);
    return isNaN(d.getTime()) ? nowISO() : d.toISOString();
  }
  // 마감일 상태(지남/임박/여유)
  function dueStatus(dueDate){
    if (!dueDate) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var due = new Date(dueDate); due.setHours(0,0,0,0);
    var diff = Math.round((due-today)/86400000);
    if (diff<0) return {cls:"over", text:(-diff)+"일 지남"};
    if (diff===0) return {cls:"soon", text:"오늘 마감"};
    if (diff<=3) return {cls:"soon", text:diff+"일 남음"};
    return {cls:"", text:"~"+fmtDate(dueDate)};
  }

  var MOOD = {
    positive:{label:"긍정", cls:"pos", icon:"🙂"},
    neutral :{label:"중립", cls:"neu", icon:"😐"},
    attention:{label:"주의 필요", cls:"att", icon:"⚠️"}
  };
  function moodBadge(mood){
    var m = MOOD[mood]; if(!m) return "";
    return '<span class="badge '+m.cls+'">'+m.icon+' '+m.label+'</span>';
  }

  /* ---------- 라우터 ---------- */
  // 등록된 라우트: 패턴(정규식) + 핸들러
  var routes = [];
  function route(pattern, handler){ routes.push({ pattern:pattern, handler:handler }); }

  function parseHash(){
    var h = location.hash.replace(/^#/, "");
    if (!h || h==="/") return { path:"/", query:{} };
    var parts = h.split("?");
    var path = parts[0];
    var query = {};
    if (parts[1]){
      parts[1].split("&").forEach(function(kv){
        var p = kv.split("=");
        query[decodeURIComponent(p[0])] = decodeURIComponent(p[1]||"");
      });
    }
    if (path.length>1 && path.charAt(path.length-1)==="/") path = path.slice(0,-1);
    return { path:path, query:query };
  }

  function render(){
    var loc = parseHash();
    var app = document.getElementById("app");
    var matched = null, params = null;
    for (var i=0;i<routes.length;i++){
      var m = loc.path.match(routes[i].pattern);
      if (m){ matched = routes[i]; params = m.slice(1); break; }
    }
    if (!matched){ app.innerHTML = viewNotFound(loc.path); }
    else {
      try { matched.handler(app, params, loc.query); }
      catch(e){
        console.error(e);
        app.innerHTML = '<div class="empty"><div class="big">⚠️</div>화면을 그리는 중 오류가 발생했습니다.<br><span class="muted">'+esc(e.message)+'</span></div>';
      }
    }
    updateNav(loc.path);
    window.scrollTo(0,0);
  }

  function updateNav(path){
    // 화면 경로를 상단 탭 섹션으로 매핑
    var section = "/";
    if (path.indexOf("/member")===0 || path.indexOf("/meeting")===0) section = "/members";
    else if (path.indexOf("/settings")===0) section = "/settings";
    var links = document.querySelectorAll("#nav a");
    links.forEach(function(a){
      a.classList.toggle("active", a.getAttribute("data-route")===section);
    });
  }

  function navigate(hash){ location.hash = hash; }

  function renderMemberList(){
    var host = document.getElementById("m-list");
    if (!host) return;
    var d = Store.load();
    var q = membersUI.q.trim().toLowerCase();

    var list = d.members.filter(function(m){
      if (!membersUI.showInactive && m.status==="inactive") return false;
      if (!q) return true;
      var hay = [m.name, m.position, m.team, (m.tags||[]).join(" "), m.note].join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    });

    // 정렬: 재직 우선 → 최근 면담 오래된 순(챙길 사람 먼저) → 이름
    list.sort(function(a,b){
      if ((a.status==="inactive") !== (b.status==="inactive")) return a.status==="inactive"?1:-1;
      var la = Compute.lastMeeting(d,a.id), lb = Compute.lastMeeting(d,b.id);
      var ta = la?new Date(la.date).getTime():0, tb = lb?new Date(lb.date).getTime():0;
      if (ta!==tb) return ta-tb; // 오래된(작은) 것 먼저
      return a.name.localeCompare(b.name,"ko");
    });

    if (!d.members.length){
      host.innerHTML = '<div class="empty"><div class="big">👥</div>아직 등록된 구성원이 없습니다.<br>'+

  function saveMemberFromForm(form, existing){
    var d = Store.load();
    var name = form.elements["name"].value.trim();
    var errEl = document.getElementById("form-err");
    if (!name){ errEl.textContent = "이름은 필수입니다."; form.elements["name"].focus(); return; }

    var tags = form.elements["tags"].value.split(",").map(function(t){return t.trim();}).filter(Boolean);
    var fields = {
      name:name,
      position: form.elements["position"].value.trim(),
      team: form.elements["team"].value.trim(),
      joinDate: form.elements["joinDate"].value || "",
      status: form.elements["status"].value==="inactive"?"inactive":"active",
      tags: tags,
      note: form.elements["note"].value.trim()
    };

    var targetId;
    if (existing){
      var ref = d.members.filter(function(x){return x.id===existing.id;})[0];
      Object.assign(ref, fields, { updatedAt:nowISO() });
      targetId = ref.id;
    } else {
      var m = Object.assign({ id:uuid() }, fields, { createdAt:nowISO(), updatedAt:nowISO() });
      d.members.push(m);
      targetId = m.id;
    }
    if (Store.save(d)) navigate("#/member/"+targetId);
  }

  // 액션 체크박스 → 완료/미완료 토글 (저장)
  function bindActionChecks(scope){
    var boxes = scope.querySelectorAll("[data-action-check]");
    boxes.forEach(function(box){
      box.addEventListener("change", function(){
        var aid = box.getAttribute("data-action-check");
        var d = Store.load();
        var a = d.actionItems.filter(function(x){return x.id===aid;})[0];
        if (!a) return;
        a.status = box.checked ? "done" : "todo";
        a.completedAt = box.checked ? nowISO() : null;
        if (Store.save(d)) render();
      });
    });
  }

  // 액션 아이템 입력 행 (a: 기존 항목 또는 null)
  function aiRow(a){
    var row = document.createElement("div");
    row.className = "ai-row";
    if (a) row.setAttribute("data-aid", a.id);
    if (a && a.status==="done") row.setAttribute("data-done", "1");
    if (a && a.completedAt) row.setAttribute("data-completed", a.completedAt);
    if (a && a.createdAt) row.setAttribute("data-created", a.createdAt);
    var content = a ? a.content : "";
    var assignee = a ? a.assignee : "leader";
    var due = a ? (a.dueDate||"") : "";
    row.innerHTML =
      '<input class="input ai-content" type="text" value="'+esc(content)+'" placeholder="할 일 내용" />'+
      '<select class="select ai-assignee">'+
        '<option value="leader"'+(assignee!=="member"?" selected":"")+'>담당: 리더</option>'+
        '<option value="member"'+(assignee==="member"?" selected":"")+'>담당: 구성원</option>'+
      '</select>'+
      '<input class="input ai-due" type="date" value="'+esc(due)+'" title="마감일" />'+
      '<button type="button" class="ai-del" title="삭제">×</button>';
    row.querySelector(".ai-del").addEventListener("click", function(){ row.remove(); });
    return row;
  }

  // 세그먼트 컨트롤 생성 (라디오 기반)
  function segmented(name, options, current){
    return '<div class="segmented" data-seg="'+name+'">'+ options.map(function(o){
      var on = (o===current);
      return '<label class="'+(on?"on":"")+'"><input type="radio" name="'+name+'" value="'+esc(o)+'"'+(on?" checked":"")+' />'+esc(o)+'</label>';
    }).join("") +'</div>';
  }
  function moodSegmented(current){
    var opts=[["positive","🙂 긍정","pos"],["neutral","😐 중립","neu"],["attention","⚠️ 주의 필요","att"]];
    return '<div class="segmented" data-seg="mood">'+ opts.map(function(o){
      var on=(o[0]===current);
      return '<label class="'+o[2]+(on?" on":"")+'"><input type="radio" name="mood" value="'+o[0]+'"'+(on?" checked":"")+' />'+o[1]+'</label>';
    }).join("") +'</div>';
  }
  function bindSegmented(form){
    form.querySelectorAll(".segmented").forEach(function(seg){
      seg.querySelectorAll("input[type=radio]").forEach(function(r){
        r.addEventListener("change", function(){
          seg.querySelectorAll("label").forEach(function(l){ l.classList.remove("on"); });
          r.parentNode.classList.add("on");
        });
      });
    });
  }

  function saveMeetingFromForm(form, existing, member){
    var d = Store.load();
    var errEl = document.getElementById("form-err");
    var summary = form.elements["summary"].value.trim();
    var type = form.elements["type"].value.trim() || "수시";
    if (!summary){ errEl.textContent = "면담 요약은 필수입니다."; form.elements["summary"].focus(); return; }

    var topics = form.elements["topics"].value.split(",").map(function(t){return t.trim();}).filter(Boolean);
    var moodEl = form.querySelector("input[name=mood]:checked");
    var formatEl = form.querySelector("input[name=format]:checked");
    var fields = {
      date: fromLocalInput(form.elements["date"].value),
      type: type,
      format: formatEl ? formatEl.value : "대면",
      topics: topics,
      summary: summary,
      memberVoice: form.elements["memberVoice"].value.trim(),
      leaderFeedback: form.elements["leaderFeedback"].value.trim(),
      mood: moodEl ? moodEl.value : "neutral",
      privateNote: form.elements["privateNote"].value.trim()
    };

    var targetId;
    if (existing){
      var ref = d.meetings.filter(function(x){return x.id===existing.id;})[0];
      Object.assign(ref, fields, { updatedAt:nowISO() });
      targetId = ref.id;
    } else {
      var mt = Object.assign({ id:uuid(), memberId:member.id }, fields, { createdAt:nowISO(), updatedAt:nowISO() });
      d.meetings.push(mt);
      targetId = mt.id;
    }

    // ----- 액션 아이템 동기화 -----
    var rows = form.querySelectorAll("#ai-editor .ai-row");
    var keepIds = {};
    rows.forEach(function(row){
      var content = row.querySelector(".ai-content").value.trim();
      if (!content) return; // 빈 행 무시
      var aid = row.getAttribute("data-aid");
      var assignee = row.querySelector(".ai-assignee").value==="member" ? "member" : "leader";
      var dueDate = row.querySelector(".ai-due").value || null;
      if (aid){
        var ref2 = d.actionItems.filter(function(x){return x.id===aid;})[0];
        if (ref2){ ref2.content=content; ref2.assignee=assignee; ref2.dueDate=dueDate; keepIds[aid]=true; }
      } else {
        var na = {
          id:uuid(), memberId:member.id, meetingId:targetId, content:content,
          assignee:assignee, dueDate:dueDate, status:"todo", completedAt:null, createdAt:nowISO()
        };
        d.actionItems.push(na); keepIds[na.id]=true;
      }
    });
    // 이 면담에 속했지만 폼에서 제거된 액션 아이템 삭제
    d.actionItems = d.actionItems.filter(function(a){
      return a.meetingId!==targetId || keepIds[a.id];
    });

    if (Store.save(d)) navigate("#/meeting/"+targetId);
  }

  function deleteMeeting(mtg){
    if (!mtg) return;
    var d = Store.load();
    var linked = d.actionItems.filter(function(a){return a.meetingId===mtg.id;}).length;
    var msg = "이 면담 기록을 삭제할까요?";
    if (linked) msg += "\n연결된 액션 아이템 "+linked+"건도 함께 삭제됩니다.";
    msg += "\n이 작업은 되돌릴 수 없습니다.";
    if (!confirm(msg)) return;
    var memberId = mtg.memberId;
    d.meetings = d.meetings.filter(function(x){return x.id!==mtg.id;});
    d.actionItems = d.actionItems.filter(function(a){return a.meetingId!==mtg.id;});
    if (Store.save(d)) navigate("#/member/"+memberId);
  }

  /* ---------- 면담 상세 ---------- */
  function viewMeetingDetail(app, params){
    var d = Store.load();
    var mt = d.meetings.filter(function(x){return x.id===params[0];})[0];
    if (!mt){ app.innerHTML = viewNotFound("면담 "+params[0]); return; }
    var member = d.members.filter(function(x){return x.id===mt.memberId;})[0] || {name:"(삭제된 구성원)", id:mt.memberId};
    var topics = (mt.topics||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join(" ");

    function block(k,v){ return v ? '<div class="mtg-block"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>' : ""; }

    app.innerHTML =
      '<div class="breadcrumb"><a href="#/members">구성원</a> › <a href="#/member/'+esc(member.id)+'">'+esc(member.name)+'</a> › 면담</div>'+
      '<div class="toolbar">'+
        '<h1 class="page-title">'+esc(mt.type||"면담")+' 면담</h1>'+
        '<div class="spacer"></div>'+
        '<a class="btn small" href="#/meeting/'+esc(mt.id)+'/edit">수정</a>'+
      '</div>'+
      '<div class="card" style="padding:20px">'+
        '<div class="tl-top" style="margin-bottom:14px">'+
          '<span class="tl-date">'+esc(fmtDateTime(mt.date))+'</span>'+
          (mt.format?'<span class="tl-format">'+esc(mt.format)+'</span>':'')+
          moodBadge(mt.mood)+
        '</div>'+
        (topics?'<div class="mtg-block"><div class="k">안건/주제</div><div class="tags">'+topics+'</div></div>':"")+
        block("면담 요약", mt.summary)+
        block("구성원 발언", mt.memberVoice)+
        block("리더 피드백/코칭", mt.leaderFeedback)+
        actionsBlock(d, mt)+
        (mt.privateNote
          ? '<div class="private-note"><div class="k">🔒 비공개 메모 (나만 봄)</div><div class="v">'+esc(mt.privateNote)+'</div></div>'
          : "")+
      '</div>';
    bindActionChecks(app);
  }

  function actionsBlock(d, mt){
    var items = d.actionItems.filter(function(a){return a.meetingId===mt.id;})
      .sort(function(a,b){ return (a.status===b.status)?0 : (a.status==="todo"?-1:1); });
    if (!items.length) return "";
    return '<div class="mtg-block"><div class="k">✅ 액션 아이템</div>'+
      '<div class="mtg-actions">'+items.map(function(a){return actionRow(a);}).join("")+'</div></div>';
  }

  function viewSettings(app){
    var d = Store.load();
    var s = d.settings;
    app.innerHTML =
      '<h1 class="page-title">설정</h1>'+
      '<div class="notice">🔐 데이터는 <b>이 브라우저에만</b> 저장됩니다(외부 전송 없음). '+
        '다른 기기·브라우저에서는 보이지 않고, 브라우저 데이터를 지우면 사라집니다. '+
        '<b>주기적으로 JSON 내보내기로 백업</b>하세요. 공용 PC에서는 사용을 권장하지 않습니다.</div>'+

      // 개인화
      '<form class="form" id="settings-form" autocomplete="off" style="margin-bottom:16px">'+
        '<div class="set-section"><h2>프로필</h2></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>리더 이름</label>'+
            '<input class="input" name="displayName" value="'+esc(s.displayName||"")+'" placeholder="예: 김리더" /></div>'+
          '<div class="field"><label>조직명</label>'+
            '<input class="input" name="orgName" value="'+esc(s.orgName||"")+'" placeholder="예: 프로덕트팀" /></div>'+
        '</div>'+
        '<div class="field"><label>면담 유형 <span class="hint">(쉼표로 구분 — 면담 작성 시 추천 목록)</span></label>'+
          '<input class="input" name="meetingTypes" value="'+esc((s.meetingTypes||[]).join(", "))+'" placeholder="정기, 성과, 고충..." /></div>'+
        '<div class="field"><label>"면담 필요" 기준 일수 <span class="hint">(마지막 면담 후 N일 경과 시 대시보드에 표시)</span></label>'+
          '<input class="input" type="number" name="overdueDays" min="1" max="365" value="'+esc(s.overdueDays||30)+'" style="max-width:140px" /></div>'+
        '<div class="form-actions"><div class="spacer"></div>'+
          '<button type="submit" class="btn primary">설정 저장</button></div>'+
      '</form>'+

      // 백업
      '<div class="form" style="margin-bottom:16px">'+
        '<div class="set-section"><h2>데이터 백업</h2>'+
          '<p class="desc">전체 데이터를 JSON 파일로 내보내거나, 백업 파일에서 복원합니다.</p></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button type="button" class="btn" id="btn-export">⬇ JSON 내보내기 (백업)</button>'+
          '<button type="button" class="btn" id="btn-import">⬆ JSON 가져오기 (복원)</button>'+
          '<input type="file" id="import-file" accept="application/json,.json" style="display:none" />'+
        '</div>'+
        '<p class="desc" style="margin-top:10px">현재 데이터: 구성원 '+d.members.length+'명 · 면담 '+d.meetings.length+'건 · 액션 '+d.actionItems.length+'건</p>'+
      '</div>'+

      // 위험 구역
      '<div class="form danger-zone">'+
        '<div class="set-section"><h2 style="color:var(--att)">전체 초기화</h2>'+
          '<p class="desc">모든 데이터를 지우고 샘플 데이터로 되돌립니다. 되돌릴 수 없으니 먼저 내보내기로 백업하세요.</p></div>'+
        '<button type="button" class="btn danger" id="btn-reset">전체 초기화 (샘플로 리셋)</button>'+
      '</div>';

    // 설정 저장
    document.getElementById("settings-form").addEventListener("submit", function(e){
      e.preventDefault();
      var f = e.target;
      var types = f.elements["meetingTypes"].value.split(",").map(function(t){return t.trim();}).filter(Boolean);
      var od = parseInt(f.elements["overdueDays"].value,10);
      var d2 = Store.load();
      d2.settings.displayName = f.elements["displayName"].value.trim();
      d2.settings.orgName = f.elements["orgName"].value.trim();
      d2.settings.meetingTypes = types.length? types : ["정기"];
      d2.settings.overdueDays = (isNaN(od)||od<1)? 30 : od;
      if (Store.save(d2)) toast("설정을 저장했습니다.");
    });

    // 내보내기
    document.getElementById("btn-export").addEventListener("click", exportData);
    // 가져오기
    var fileInput = document.getElementById("import-file");
    document.getElementById("btn-import").addEventListener("click", function(){ fileInput.value=""; fileInput.click(); });
    fileInput.addEventListener("change", function(){ if (fileInput.files[0]) importData(fileInput.files[0]); });
    // 초기화
    document.getElementById("btn-reset").addEventListener("click", resetAll);
  }

  function exportData(){
    var d = Store.load();
    var json = JSON.stringify(d, null, 2);
    var blob = new Blob([json], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = ymd(new Date());
    a.href = url; a.download = "면담일지_백업_"+stamp+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("백업 파일을 내려받았습니다.");
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); }
      catch(e){ alert("가져오기 실패: 올바른 JSON 파일이 아닙니다."); return; }
      if (!data || (!Array.isArray(data.members) && !Array.isArray(data.meetings))){
        alert("가져오기 실패: 면담일지 백업 형식이 아닙니다."); return;
      }
      var d = Store.load();
      var msg = "현재 데이터를 가져온 파일로 교체할까요?\n"+
        "(현재: 구성원 "+d.members.length+"명 / 가져올 파일: 구성원 "+(data.members||[]).length+"명)\n"+
        "이 작업은 되돌릴 수 없습니다. 필요하면 먼저 현재 데이터를 내보내세요.";
      if (!confirm(msg)) return;
      var normalized = normalize(data);
      if (Store.save(normalized)){ toast("데이터를 가져왔습니다."); navigate("#/"); render(); }
    };
    reader.onerror = function(){ alert("파일을 읽지 못했습니다."); };
    reader.readAsText(file);
  }

  function resetAll(){
    if (!confirm("모든 데이터를 지우고 샘플 데이터로 초기화할까요?\n되돌릴 수 없습니다. 먼저 백업을 권장합니다.")) return;
    if (!confirm("정말 초기화하시겠습니까? 마지막 확인입니다.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    var seeded = seedData();
    if (Store.save(seeded)){ toast("샘플 데이터로 초기화했습니다."); navigate("#/"); render(); }
  }

  function viewNotFound(path){
    return '<div class="empty"><div class="big">🧭</div>없는 화면입니다.<br>'+
           '<span class="muted">'+esc(path)+'</span><br><br>'+
           '<a class="btn" href="#/">대시보드로</a></div>';
  }

  /* ---------- 라우트 등록 ---------- */
  route(/^\/$/, viewDashboard);
  route(/^\/members$/, viewMembers);
  route(/^\/member\/new$/, viewMemberForm);
  route(/^\/member\/([^\/]+)\/edit$/, viewMemberForm);
  route(/^\/member\/([^\/]+)\/meeting\/new$/, viewMeetingForm);
  route(/^\/member\/([^\/]+)$/, viewMemberDetail);
  route(/^\/meeting\/([^\/]+)\/edit$/, viewMeetingForm);
  route(/^\/meeting\/([^\/]+)$/, viewMeetingDetail);
  route(/^\/settings$/, viewSettings);

  /* ---------- 부트 ---------- */
  // 전역 노출 (다음 단계에서 확장에 사용)
  window.App = { Store:Store, navigate:navigate, render:render,
                 helpers:{ uuid:uuid, nowISO:nowISO, ymd:ymd, esc:esc, daysAgoISO:daysAgoISO } };

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", function(){
    Store.load();      // 최초 시드 보장
    if (!location.hash) location.hash = "#/";
    render();
  });
  // DOMContentLoaded가 이미 지났을 경우 대비
  if (document.readyState!=="loading"){
    Store.load(); if(!location.hash) location.hash="#/"; render();
  }
})();
</script>
</body>
</html>
